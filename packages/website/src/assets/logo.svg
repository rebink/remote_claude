<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="Patchwire logo">
  <!-- LOCAL square: paper outline -->
  <rect x="2" y="2" width="11" height="11" stroke="#0E0E10" stroke-width="1.6" fill="#F5F1E8"/>
  <!-- REMOTE square: ink fill -->
  <rect x="19" y="19" width="11" height="11" fill="#0E0E10"/>
  <!-- The wire — dashed diagonal connecting the two squares -->
  <line x1="9" y1="16" x2="23" y2="16" stroke="#0E0E10" stroke-width="1.4" stroke-dasharray="1.4 2.4"/>
  <!-- The patch — a single phosphor dot mid-wire -->
  <circle cx="16" cy="16" r="1.6" fill="#C9F564"/>
</svg>
