<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Patchwire</title>
    <style>
      /* Dark from the very first paint so there's no white flash before the app loads. */
      html, body { margin: 0; height: 100%; background: #0E0E10; }
      #app { height: 100%; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #0E0E10; color: #F5F1E8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        transition: opacity 260ms ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark { width: 76px; height: 76px; }
      #splash .name { font-size: 14px; letter-spacing: 0.14em; opacity: 0.85; }
      #splash .dot { width: 6px; height: 6px; border-radius: 50%; background: #C9F564; animation: pw-pulse 1.1s ease-in-out infinite; }
      @keyframes pw-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="splash">
      <svg class="mark" viewBox="0 0 32 32" fill="none" role="img" aria-label="Patchwire">
        <rect width="32" height="32" rx="6" fill="#0E0E10" />
        <g transform="translate(4 4)" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9.5 L12 5.5 Q12 3 9.5 3 L5.5 3 Q3 3 3 5.5 L3 9.5 Q3 12 5.5 12 L10 12" stroke="#F5F1E8" stroke-width="2" fill="none" />
          <path d="M16 13 L18.5 13 Q21 13 21 15.5 L21 18.5 Q21 21 18.5 21 L15.5 21 Q13 21 13 18.5 L13 16 A3 3 0 0 0 16 13 Z" fill="#F5F1E8" />
          <circle cx="12.5" cy="12.5" r="2.4" fill="#C9F564" />
        </g>
      </svg>
      <div class="name">PATCHWIRE</div>
      <div class="dot"></div>
    </div>
    <div id="app"></div>
  </body>
</html>
