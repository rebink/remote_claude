<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Patchwire mark for the activity bar. VS Code renders this as a flat
       monochrome silhouette (it masks the shape and applies the theme color),
       so every element is currentColor: an open outline square (your editor),
       the connector dot (the two-way signal), and a filled square with a notch
       where the dot nestles (a machine you own). Bold shapes, no thin lines,
       so it stays legible at ~16px. -->
  <path d="M12 9.5 L12 5.5 Q12 3 9.5 3 L5.5 3 Q3 3 3 5.5 L3 9.5 Q3 12 5.5 12 L10 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 13 L18.5 13 Q21 13 21 15.5 L21 18.5 Q21 21 18.5 21 L15.5 21 Q13 21 13 18.5 L13 16 A3 3 0 0 0 16 13 Z" fill="currentColor"/>
  <circle cx="12.5" cy="12.5" r="2.4" fill="currentColor"/>
</svg>
