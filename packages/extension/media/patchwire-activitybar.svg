<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Patchwire mark for the activity bar: monochrome so VS Code themes it
       (uses currentColor). Outline square = your editor, filled square =
       a machine you own, dashed wire + dot = the two-way signal. -->
  <rect x="1.75" y="1.75" width="9.25" height="9.25" stroke="currentColor" stroke-width="1.8"/>
  <rect x="13" y="13" width="9.25" height="9.25" fill="currentColor"/>
  <line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1.5 2.2"/>
  <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
</svg>
