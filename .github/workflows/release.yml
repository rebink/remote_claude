name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile=false

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

      - name: Package VS Code extension (.vsix)
        run: pnpm --filter patchwire-vscode package

      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter patchwire publish --access public --provenance --no-git-checks

      - name: Create GitHub release with .vsix attached
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/extension/patchwire-vscode-*.vsix
